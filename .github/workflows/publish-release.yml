name: Publish versioned macOS installer

on:
  push:
    branches: [main]

# Only an explicit release commit starts publication. Ordinary development
# pushes and GitHub Actions' own release-assets pushes never publish.
permissions:
  contents: read

concurrency:
  group: codex-harbor-publish
  cancel-in-progress: false

jobs:
  publish:
    if: "startsWith(github.event.head_commit.message, 'release: v')"
    runs-on: macos-15
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      CODEX_HARBOR_BUILD_JOBS: '4'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version and source commit
        shell: bash
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          headline=$(git log -1 --pretty=%s)
          [[ "$headline" == "release: v${version}"* ]] || {
            echo 'Release commit message does not match Info.plist version' >&2
            exit 2
          }
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "v${version} is already published; refusing to overwrite" >&2
            exit 2
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Validate exact release source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          /bin/zsh -n Scripts/build-app.sh
          /bin/zsh -n Scripts/create-dmg.sh
          /bin/zsh -n Scripts/verify-dmg.sh
          /bin/bash -n Scripts/package-official-release.sh
          plutil -lint Resources/Info.plist
          swift test --parallel --jobs "$CODEX_HARBOR_BUILD_JOBS"
      - name: Sign, verify and notarize the Apple Silicon installer
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: /bin/bash Scripts/package-official-release.sh
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '# Codex Harbor v%s\n\n' "$VERSION"
            git log -1 --format=%b
            printf '\nThe Apple Silicon DMG includes Xray and Mihomo, uses Developer ID signing, and is notarized by Apple.\n'
            printf '\nSource commit `%s`\n' "$GITHUB_SHA"
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "v${VERSION}" "dist/${ASSET_NAME}" dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Codex Harbor v${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Update public latest DMG mirror
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release-assets
          git worktree add -B release-assets "$RUNNER_TEMP/harbor-release-assets" origin/release-assets
          assets="$RUNNER_TEMP/harbor-release-assets"
          mkdir -p "$assets/v${VERSION}" "$assets/latest"
          cp "dist/${ASSET_NAME}" "$assets/v${VERSION}/${ASSET_NAME}"
          cp "dist/${ASSET_NAME}" "$assets/latest/Codex-Harbor-arm64.dmg"
          cp dist/SHA256SUMS "$assets/v${VERSION}/SHA256SUMS"
          (cd "$assets/latest" && shasum -a 256 Codex-Harbor-arm64.dmg > SHA256SUMS)
          python3 - "$assets/latest/build-info.json" "$VERSION" "$GITHUB_SHA" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          path, version, sha = sys.argv[1:]
          with open(path, 'w') as output:
              json.dump({'version':version,'sourceCommit':sha,'builtAt':datetime.now(timezone.utc).isoformat()}, output)
          PY
          git -C "$assets" config user.name 'github-actions[bot]'
          git -C "$assets" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$assets" add "v${VERSION}" latest
          git -C "$assets" commit -m "release-assets: v${VERSION}"
          git -C "$assets" push origin HEAD:release-assets
